<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartobi — мультфільми на замовлення</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box; -webkit-text-size-adjust:100%;}
  html{scroll-behavior:smooth;}
  body{background:#0A0722;}

  /* Кожна секція підлаштовується під реальне співвідношення сторін СВОЄЇ
     картинки (img задає висоту сам, через height:auto) — це важливо, бо
     дитяча і доросла картинки мають РІЗНЕ співвідношення сторін (9:16 і
     9:20), і жорсткий однаковий бокс під обидві раніше стискав дорослу
     картинку і залишав порожні поля по боках. */
  section.frame{position:relative; width:100%; max-width:540px; margin:0 auto; line-height:0;}
  .frame-inner{position:relative;}
  .frame-inner img{width:100%; height:auto; display:block;}

  .hot{position:absolute; cursor:pointer; background:transparent; border:none; padding:0;}
  .hot:active{opacity:0.6;}

  /* ---------- Секція 1: Дитяча лінійка ---------- */
  #section-kids{background:#0A0722;}
  #section-kids .cta-main{left:33.27%; top:31.5%; width:33.37%; height:4%;}
  #section-kids .cta-view-example{left:56.63%; top:65.8%; width:29.2%; height:3%;}
  #section-kids .cta-final{left:30.77%; top:79.3%; width:38.38%; height:4%;}
  #section-kids .play-btn{left:24.93%; top:59%; width:13.35%; height:7%;}
  /* Карточки 5 жанрів — попередні координати, звірити з фінальною картинкою завтра */
  #section-kids .genre-1{left:2%; top:40%; width:18%; height:9%;}
  #section-kids .genre-2{left:22%; top:40%; width:18%; height:9%;}
  #section-kids .genre-3{left:42%; top:40%; width:18%; height:9%;}
  #section-kids .genre-4{left:62%; top:40%; width:18%; height:9%;}
  #section-kids .genre-5{left:82%; top:40%; width:16%; height:9%;}

  /* Підказка "скрольте далі" в кінці першої секції */
  .scroll-hint{
    position:relative; width:100%; max-width:540px; margin:0 auto;
    background:linear-gradient(180deg,#0A0722,#150e3a);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:22px 16px 26px; text-align:center; font-family:Arial,sans-serif;
    cursor:pointer; border:none;
  }
  .scroll-hint span{color:#e8e5f5; font-size:14px; font-weight:600; margin-bottom:8px;}
  .scroll-hint svg{width:26px; height:26px; animation:bounce 1.6s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(8px);}}

  /* ---------- Модалка відео-плеєра ---------- */
  .video-modal{
    position:fixed; inset:0; z-index:50; background:rgba(5,3,20,0.92);
    display:none; align-items:center; justify-content:center; padding:16px; flex-direction:column; gap:12px;
  }
  .video-modal.open{display:flex;}
  .video-modal video{width:100%; max-width:420px; max-height:75vh; border-radius:14px; display:block;}
  .video-modal .close-btn{
    position:absolute; top:16px; right:16px; width:40px; height:40px; border-radius:100px;
    background:rgba(255,255,255,0.12); border:none; color:#fff; font-size:20px; cursor:pointer; z-index:51;
  }
  .video-modal .order-btn{
    display:none; width:100%; max-width:420px; padding:14px; border:none; border-radius:100px;
    background:linear-gradient(135deg,#ff9a3c,#e2842c); color:#fff; font-family:Arial,sans-serif;
    font-weight:700; font-size:15px; cursor:pointer;
  }
  .video-modal .order-btn.visible{display:block;}

  /* ---------- Міні-превью прикладів під дитячою секцією ---------- */
  .kids-examples{
    display:flex; gap:10px; justify-content:center; padding:14px 16px 20px;
    background:#0A0722; font-family:Arial,sans-serif;
  }
  .kids-examples button{
    position:relative; width:130px; border:none; padding:0; border-radius:12px; overflow:hidden; cursor:pointer;
  }
  .kids-examples img{width:100%; display:block; aspect-ratio:9/16; object-fit:cover;}
  .kids-examples span{
    position:absolute; bottom:6px; left:6px; right:6px; color:#fff; font-size:11px; font-weight:700;
    text-shadow:0 1px 4px rgba(0,0,0,0.8); text-align:left;
  }
  .kids-examples .play-dot{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:32px; height:32px; border-radius:100px; background:rgba(255,255,255,0.85);
    display:flex; align-items:center; justify-content:center;
  }
  .kids-examples .play-dot svg{width:14px; height:14px; fill:#1a1030;}

  /* ---------- Блок "реакції батьків" (соцпруф) ---------- */
  #section-reactions{
    background:linear-gradient(180deg,#150e3a,#1a1440);
    padding:24px 16px 8px; text-align:center; font-family:Arial,sans-serif;
  }
  #section-reactions h3{color:#fff; font-size:17px; margin-bottom:14px;}
  .reactions-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; max-width:540px; margin:0 auto;
  }
  .reactions-grid .r-item{grid-column:span 1;}
  .reactions-grid .r-item.wide{grid-column:span 2;}
  .reactions-grid img{width:100%; border-radius:14px; display:block; object-fit:cover; aspect-ratio:4/3;}
  #section-adult{background:#060726;}
  #section-adult .cta-main{left:12%; top:25.95%; width:33%; height:3.37%;}
  #section-adult .arrow-left-1{left:0%; top:39.03%; width:5%; height:4.22%;}
  #section-adult .arrow-right-1{left:95%; top:39.03%; width:5%; height:4.22%;}
  #section-adult .card-1{left:2%; top:33.97%; width:23%; height:13.5%;}
  #section-adult .card-2{left:27%; top:33.97%; width:23%; height:13.5%;}
  #section-adult .card-3{left:52%; top:33.97%; width:23%; height:13.5%;}
  #section-adult .card-4{left:77%; top:33.97%; width:21%; height:13.5%;}
  #section-adult .arrow-left-2{left:0%; top:66.03%; width:5%; height:4.22%;}
  #section-adult .arrow-right-2{left:95%; top:66.03%; width:5%; height:4.22%;}
  #section-adult .ex-1{left:2%; top:63.5%; width:23%; height:10.97%;}
  #section-adult .ex-2{left:27%; top:63.5%; width:23%; height:10.97%;}
  #section-adult .ex-3{left:52%; top:63.5%; width:23%; height:10.97%;}
  #section-adult .ex-4{left:77%; top:63.5%; width:21%; height:10.97%;}
  #section-adult .cta-final{left:29%; top:81.22%; width:42%; height:3.37%;}

  /* Кнопка "наверх" на другій секції — щоб повернутись до дитячої без довгого скролу */
  /* Плаваюча підказка "гортай вниз" — видно тільки поки не долистали до
     дорослої секції. Не запечена в картинку, окремий шар. */
  .scroll-hint-fab{
    position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:20;
    background:rgba(20,15,50,0.8); color:#fff; border:1px solid rgba(255,255,255,0.3);
    border-radius:100px; padding:8px 16px; display:flex; align-items:center; gap:6px;
    font-family:Arial,sans-serif; font-size:12px; font-weight:600; text-decoration:none;
    opacity:1; transition:opacity .3s;
  }
  .scroll-hint-fab.hidden{opacity:0; pointer-events:none;}
  .scroll-hint-fab svg{width:16px; height:16px; animation:bounce 1.4s infinite;}
  @keyframes bounce{0%,100%{transform:translateY(0);} 50%{transform:translateY(5px);}}

  .back-to-top{
    position:fixed; right:16px; bottom:16px; z-index:20;
    background:rgba(20,15,50,0.75); color:#fff; border:1px solid rgba(255,255,255,0.25);
    border-radius:100px; width:44px; height:44px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; text-decoration:none; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .back-to-top.visible{opacity:1; pointer-events:auto;}
  .back-to-top svg{width:20px; height:20px;}

  /* ---------- Полоска соцмереж (внизу сторінки, реальний HTML-шар) ---------- */
  /* П'ять кнопок строго в межах ширини лендингу (flex:1 1 0 + gap замість
     aspect-ratio, який раніше "розпирав" ряд і виштовхував 5-ту іконку за
     екран). Кожна — окрема кнопка з заокругленням і тінню, щоб було видно,
     що це саме кнопка, а не просто картинка. */
  .social-bar{
    display:flex; width:100%; gap:8px; padding:14px 12px; box-sizing:border-box;
    background:#0A0722;
  }
  .social-bar a{
    flex:1 1 0; min-width:0; height:52px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    color:#fff; text-decoration:none; transition:transform .15s, filter .15s;
    box-shadow:0 3px 8px rgba(0,0,0,0.4);
  }
  .social-bar a:hover, .social-bar a:active{filter:brightness(1.15); transform:translateY(-1px);}
  .social-bar svg{width:22px; height:22px;}
  .social-bar .sb-youtube{background:#FF0000;}
  .social-bar .sb-tiktok{background:#1a1a1a;}
  .social-bar .sb-instagram{background:linear-gradient(45deg,#FEDA75,#FA7E1E,#D62976,#962FBF,#4F5BD5);}
  .social-bar .sb-facebook{background:#1877F2;}
  .social-bar .sb-threads{background:#1a1a1a;}

  /* ---------- Спільний бренд-лого (плаваюче, ліва верхня позиція) ---------- */
  .brand-logo{
    position:fixed; top:12px; left:12px; z-index:30;
    width:44px; height:44px; border-radius:100px; overflow:hidden; cursor:pointer;
    border:2px solid rgba(255,255,255,0.35); box-shadow:0 4px 16px rgba(0,0,0,0.4);
    background:#1a1440;
  }
  .brand-logo img{width:100%; height:100%; object-fit:cover; display:block;}

  /* ---------- Спільний перемикач мов (плаваючий, видно на обох секціях) ---------- */
  .lang-switch{
    position:fixed; top:12px; right:12px; z-index:30;
    background:rgba(20,15,50,0.7); border:1px solid rgba(255,255,255,0.25); border-radius:100px;
    display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
    padding:8px 14px; font-family:Arial,sans-serif; color:#fff; font-size:13px; font-weight:600;
  }
  .lang-switch svg{width:16px; height:16px; flex-shrink:0;}
  .lang-dropdown{
    position:fixed; top:52px; right:12px; z-index:35; background:#1a1440; border:1px solid rgba(255,255,255,0.15);
    border-radius:14px; padding:6px; display:none; max-height:60vh; overflow-y:auto; min-width:170px;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);
  }
  .lang-dropdown.open{display:block;}
  .lang-dropdown button{display:block; width:100%; text-align:left; background:none; border:none; color:#e8e5f5;
    font-family:Arial,sans-serif; font-size:14px; padding:9px 12px; border-radius:8px; cursor:pointer;}
  .lang-dropdown button:hover, .lang-dropdown button:active{background:rgba(255,255,255,0.1);}
  .lang-dropdown button.active{color:#ffb020; font-weight:700;}

  @media (orientation:landscape) and (max-height:600px){
    section.frame{max-width:100vw;}
  }
</style>
</head>
<body>

<!-- Плаваючий бренд-лого Cartobi, замінює "три палички" з макету -->
<div class="brand-logo" onclick="window.scrollTo({top:0, behavior:'smooth'})">
  <img src="assets/cartobi-logo.png" alt="Cartobi">
</div>

<!-- Плаваючий перемикач мов, видно завжди -->
<div class="lang-switch" onclick="toggleLangDropdown()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20 15 15 0 010-20z"/></svg>
  <span id="lang-current">UA</span>
</div>
<div class="lang-dropdown" id="lang-dropdown"></div>

<!-- ============ СЕКЦІЯ 1: ДИТЯЧА ЛІНІЙКА ============ -->
<section class="frame" id="section-kids">
  <div class="frame-inner">
    <img src="hero-kids.jpg" alt="Cartobi — дитяча лінійка">

  <button class="hot genre-3" onclick="openVideo('videos/kids-tale.mp4','kids','tale')"></button>
  <button class="hot genre-4" onclick="openVideo('videos/kids-cars.mp4','kids','cars')"></button>
  <button class="hot genre-5" onclick="openVideo('videos/kids-heroes.mp4','kids','heroes')"></button>

<!-- ============ СЕКЦІЯ 2: ДОРОСЛА ЛІНІЙКА ============ -->
<section class="frame" id="section-adult">
  <div class="frame-inner">
    <img src="hero-adult.jpg" alt="Cartobi — доросла лінійка">
  </div>
  <button class="hot cta-main" onclick="goToBot('romance')"></button>

  <button class="hot card-4" onclick="openVideo('videos/adult-wedding.mp4','wedding')"></button>

  <button class="hot arrow-right-2" onclick="shiftExamples(1)"></button>
  <button class="hot ex-1" onclick="openVideo('videos/romance-2-restaurant-flowers.mp4','romance')"></button>
  <button class="hot ex-2" onclick="openVideo('videos/romance-1-park-bouquet.mp4','romance')"></button>
  <button class="hot ex-3" onclick="openVideo('videos/corporate-mike-store.mp4','corporate')"></button>
  <button class="hot ex-4" onclick="openVideo('videos/romance-5-rollsroyce.mp4','romance')"></button>
  <button class="hot cta-final" onclick="goToBot('romance')"></button>
</section>

<!-- Полоска соцмереж, на всю ширину, у фірмових кольорах кожної платформи -->
<div class="social-bar">

<!-- Модалка відео-плеєра (спільна для обох секцій) -->

  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
</a>

<script>
  const BOT_USERNAME = 'CartobiBot'; // подтверждено Игорем — @CartobiBot

  const LANGUAGES = [
    { code: 'ua', label: 'Українська' },
    { code: 'en', label: 'English' },
    { code: 'ru', label: 'Русский' },
    { code: 'pl', label: 'Polski' },
    { code: 'de', label: 'Deutsch' },
    { code: 'fr', label: 'Français' },
    { code: 'es', label: 'Español' },
    { code: 'it', label: 'Italiano' },
    { code: 'pt', label: 'Português' },
    { code: 'tr', label: 'Türkçe' },
  ];
  let currentLang = 'ua';

  function buildLangDropdown() {
    const el = document.getElementById('lang-dropdown');
    el.innerHTML = LANGUAGES.map(l =>
      `<button class="${l.code === currentLang ? 'active' : ''}" onclick="setLang('${l.code}')">${l.label}</button>`
    ).join('');
  }
  function toggleLangDropdown() {
    document.getElementById('lang-dropdown').classList.toggle('open');
  }
  function setLang(lang) {
    document.getElementById('lang-dropdown').classList.remove('open');
    if (lang === 'ua') {
      currentLang = 'ua';
      document.getElementById('lang-current').textContent = 'UA';
      buildLangDropdown();
      return;
    }
    // Переклад контенту ще не підключено (текст запечений у самих
    // ілюстраціях) — чесно повідомляємо, а не мовчки нічого не робимо.
    showLangToast('Ця мова скоро буде доступна 🙌');
  }
  function showLangToast(text) {
    let toast = document.getElementById('lang-toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'lang-toast';
      toast.style.cssText = 'position:fixed;left:50%;bottom:90px;transform:translateX(-50%);' +
        'background:#1a1440;color:#fff;padding:10px 18px;border-radius:100px;' +
        'font-family:Arial,sans-serif;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,0.5);' +
        'border:1px solid rgba(255,255,255,0.2); opacity:0; transition:opacity .25s;';
      document.body.appendChild(toast);
    }
    toast.textContent = text;
    requestAnimationFrame(() => { toast.style.opacity = '1'; });
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(() => { toast.style.opacity = '0'; }, 2200);
  }
  buildLangDropdown();

  function openVideo(src, genre, substyle) {
    const modal = document.getElementById('video-modal');
    const video = document.getElementById('modal-video');
    const orderBtn = document.getElementById('modal-order-btn');
    video.src = src;
    modal.classList.add('open');
    video.play().catch(() => {});
    if (genre) {
      orderBtn.classList.add('visible');
      orderBtn.onclick = () => goToBot(genre, substyle);
    } else {
      orderBtn.classList.remove('visible');
      orderBtn.onclick = null;
    }
  }
  function closeVideo() {
    const modal = document.getElementById('video-modal');
    const video = document.getElementById('modal-video');
    video.pause();
    video.removeAttribute('src');
    video.load();
    modal.classList.remove('open');
  }
  function playPreview() { openVideo('videos/kids-space.mp4', 'kids', 'space'); }
  function shiftFormats(dir) { console.log('shift formats', dir); }
  function shiftExamples(dir) { console.log('shift examples', dir); }

  function goToBot(genre, substyle) {
    let payload = 'g' + genre;
    if (substyle) payload += '_s' + substyle;
    window.location.href = 'https://t.me/' + BOT_USERNAME + '?start=' + payload;
  }

  // Показуємо кнопку "наверх" тільки коли доросла секція у в'юпорті
  const adultSection = document.getElementById('section-adult');
  const backBtn = document.getElementById('back-to-top');
  const socialBar = document.querySelector('.social-bar');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      backBtn.classList.toggle('visible', entry.isIntersecting);
    });
  }, { threshold: 0.3 });
  observer.observe(adultSection);

  // Ховаємо кнопку "наверх", коли внизу вже видно полоску соцмереж —
  // інакше кнопка лягає прямо на іконку останньої соцмережі.
  const socialObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) backBtn.classList.remove('visible');
    });
  }, { threshold: 0.01 });
  if (socialBar) socialObserver.observe(socialBar);

  // Ховаємо підказку "гортай вниз", щойно доросла секція потрапляє у в'юпорт
  const scrollHint = document.getElementById('scroll-hint-fab');
  const hintObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      scrollHint.classList.toggle('hidden', entry.isIntersecting);
    });
  }, { threshold: 0.15 });
  if (scrollHint) hintObserver.observe(adultSection);
</script>

</body>
</html>
