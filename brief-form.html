<style>
  :root{
    --bg:#0A0722; --card:#150e3a; --card2:#1c1450;
    --accent:#ffb020; --accent2:#ff8a00; --accent-text:#2a1400;
    --text:#e8e5f5; --muted:#9b96c4; --border:rgba(255,255,255,0.14);
    --danger:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:16px 16px 120px;
  }
  h1{font-size:19px; margin:4px 0 2px; color:var(--accent);}
  .intro{font-size:14px; color:var(--muted); margin:0 0 20px; line-height:1.5;}
  .photo-notice{
    background:rgba(255,176,32,0.12); border:1.5px solid rgba(255,176,32,0.4); border-radius:12px;
    padding:11px 13px; font-size:13px; color:var(--text); margin:0 0 22px; line-height:1.5;
  }
  .photo-notice b{color:var(--accent);}
  .q{margin-bottom:22px;}
  .q-label{font-size:14.5px; font-weight:700; margin-bottom:9px; line-height:1.4;}
  .q-num{color:var(--accent); font-weight:800; margin-right:4px;}
  .q-hint{font-size:12px; color:var(--muted); margin-top:5px; line-height:1.4;}
  textarea, input[type=text]{
    width:100%; background:var(--card); border:1.5px solid var(--border); border-radius:12px;
    color:var(--text); font-size:14.5px; padding:11px 13px; font-family:inherit;
    resize:vertical; min-height:44px;
  }
  textarea:focus, input[type=text]:focus{outline:none; border-color:var(--accent);}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    background:var(--card); border:1.5px solid var(--border); border-radius:100px;
    padding:9px 15px; font-size:13.5px; cursor:pointer; color:var(--text); user-select:none;
    transition:all .15s;
  }
  .chip.selected{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--accent-text); border-color:transparent; font-weight:700;}
  .price-tag{color:var(--accent); font-weight:800;}
  .total-bar{
    position:fixed; left:0; right:0; bottom:64px; background:var(--card2);
    border-top:1px solid var(--border); padding:10px 16px; font-size:14px;
    display:none; justify-content:space-between; align-items:center;
  }
  .total-bar.show{display:flex;}
  .total-bar b{color:var(--accent); font-size:16px;}
  .submit-bar{
    position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:var(--bg); border-top:1px solid var(--border);
  }
  .submit-btn{
    width:100%; border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:800;
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--accent-text); cursor:pointer;
  }
  .submit-btn:disabled{opacity:0.5;}
  .err{color:var(--danger); font-size:12.5px; margin-top:5px; display:none;}
  .err.show{display:block;}
  .section-title{font-size:13px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin:26px 0 12px; font-weight:700;}
</style>
</head>

  { key: 'rush', label: '⚡ Терміново', price: 20 },
];
const KIDS_GENRES = ['Космос', 'Дракони', 'Казка', 'Машинки', 'Супергерої'];

const form = document.getElementById('briefForm');
const titleEl = document.getElementById('title');
const introEl = document.getElementById('intro');
const submitBtn = document.getElementById('submitBtn');
const totalBar = document.getElementById('totalBar');
const totalVal = document.getElementById('totalVal');

const answers = {}; // key -> value, зібрані тут і надсилаються боту одним payload

function chipsField(container, key, options, multi) {
  const wrap = document.createElement('div');
  wrap.className = 'chips';
  const selected = new Set();
  options.forEach((opt) => {
    const label = typeof opt === 'string' ? opt : opt.label;
    const value = typeof opt === 'string' ? opt : opt.key;
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = label;
    chip.onclick = () => {
      if (multi) {
        if (selected.has(value)) { selected.delete(value); chip.classList.remove('selected'); }
        else { selected.add(value); chip.classList.add('selected'); }
        answers[key] = Array.from(selected);
      } else {
        wrap.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));
        chip.classList.add('selected');
        selected.clear(); selected.add(value);
        answers[key] = value;
      }
      updateTotals();
      validateForm();
    };
    wrap.appendChild(chip);
  });
  container.appendChild(wrap);
}

function textField(container, key, placeholder) {
  const el = document.createElement('textarea');
  el.placeholder = placeholder || 'Ваша відповідь…';
  el.rows = 2;
  el.oninput = () => { answers[key] = el.value.trim(); validateForm(); };
  container.appendChild(el);
}

function addQuestion(idx, total, q) {
  const wrap = document.createElement('div');
  wrap.className = 'q';
  wrap.dataset.key = q.key;
  const label = document.createElement('div');
  label.className = 'q-label';
  label.innerHTML = `<span class="q-num">${idx}/${total}</span>${q.q}`;
  wrap.appendChild(label);
  if (q.type === 'buttons') chipsField(wrap, q.key, q.options, false);
  else textField(wrap, q.key);
  if (q.hint) {
    const hint = document.createElement('div');
    hint.className = 'q-hint';
    hint.textContent = q.hint;
    wrap.appendChild(hint);
  }
  const err = document.createElement('div');
  err.className = 'err';
  err.textContent = 'Це поле обов\'язкове';
  wrap.appendChild(err);
  form.appendChild(wrap);
}

let allQuestions = [];
let isKids = track === 'kids';

const photoNoticeEl = document.getElementById('photoNotice');
if (isKids) {
  photoNoticeEl.innerHTML = '📷 <b>Після цієї форми бот попросить фото дитини</b> — це обов\'язковий крок, без нього не можемо зробити персонажа.';
} else if (track === 'pets') {
  photoNoticeEl.innerHTML = '📷 <b>Після цієї форми бот попросить фото улюбленця</b> — це обов\'язковий крок, без нього не можемо зробити персонажа схожим.';
} else {
  photoNoticeEl.innerHTML = '📷 <b>Після цієї форми бот запропонує надіслати фото</b> — необов\'язково (опис зовнішності вже є нижче), але дуже рекомендуємо для точнішої схожості.';
}

if (isKids) {
  titleEl.textContent = '🎬 Персональний мультфільм';
  introEl.textContent = 'Дам трохи більше питань, ніж зазвичай — щоб результат точно збігся з тим, що ви уявляєте, адже у вартість входить лише 1 безкоштовна правка.';

  allQuestions = [{ key: 'name', q: 'Ім\'я героя?' }];
  if (!presetGenre) allQuestions.push({ key: 'interest', type: 'buttons', q: 'Який жанр?', options: KIDS_GENRES });
  allQuestions.push({ key: 'gender', type: 'buttons', q: 'Хлопчик чи дівчинка?', options: ['Хлопчик', 'Дівчинка'] });

  allQuestions.forEach((q, i) => addQuestion(i + 1, allQuestions.length + 2, q));

  if (presetGenre) answers.interest = presetGenre;

  // Тариф — окремим блоком, з реальною ціною і живим підрахунком
  const tariffWrap = document.createElement('div');
  tariffWrap.className = 'q';
  tariffWrap.dataset.key = 'tariff';
  tariffWrap.innerHTML = `<div class="q-label"><span class="q-num">${allQuestions.length + 1}/${allQuestions.length + 2}</span>Оберіть тариф</div>`;
  const tariffChips = document.createElement('div');
  tariffChips.className = 'chips';
  KIDS_TARIFFS.forEach((t) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${t.label} — <span class="price-tag">$${t.price}</span>`;
    chip.onclick = () => {
      tariffChips.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));
      chip.classList.add('selected');
      answers.tariff = t.key;
      updateTotals(); validateForm();
    };
    tariffChips.appendChild(chip);
  });
  tariffWrap.appendChild(tariffChips);
  const tariffHint = document.createElement('div');
  tariffHint.className = 'q-hint';
  tariffHint.innerHTML = KIDS_TARIFFS.map((t) => `<b style="color:var(--accent)">${t.label} ($${t.price}):</b> ${t.desc}`).join('<br>');
  tariffWrap.appendChild(tariffHint);
  form.appendChild(tariffWrap);

  // Допродажі — мультивибір
  const addonsWrap = document.createElement('div');
  addonsWrap.className = 'q';
  addonsWrap.innerHTML = `<div class="q-label"><span class="q-num">${allQuestions.length + 2}/${allQuestions.length + 2}</span>Додати трохи магії? (необов'язково)</div>`;
  const addonsChips = document.createElement('div');
  addonsChips.className = 'chips';
  answers.addons = [];
  KIDS_ADDONS.forEach((a) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `${a.label} — <span class="price-tag">+$${a.price}</span>`;
    chip.onclick = () => {
      const idx = answers.addons.indexOf(a.key);
      if (idx >= 0) { answers.addons.splice(idx, 1); chip.classList.remove('selected'); }
      else { answers.addons.push(a.key); chip.classList.add('selected'); }
      updateTotals();
    };
    addonsChips.appendChild(chip);
  });
  addonsWrap.appendChild(addonsChips);
  form.appendChild(addonsWrap);

  totalBar.classList.add('show');
} else {
  const brief = ADULT_BRIEFS[track] || ADULT_BRIEFS.romance;
  titleEl.textContent = brief.title;
  introEl.textContent = brief.intro;
  allQuestions = brief.questions;
  allQuestions.forEach((q, i) => addQuestion(i + 1, allQuestions.length, q));

  if (track === 'pets') {
    const tariffWrap = document.createElement('div');
    tariffWrap.className = 'q';
    tariffWrap.dataset.key = 'tariff';
    tariffWrap.innerHTML = '<div class="q-label">Оберіть рівень</div>';
    const tariffChips = document.createElement('div');
    tariffChips.className = 'chips';
    PET_TARIFFS.forEach((t) => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.innerHTML = `${t.label} — <span class="price-tag">$${t.price}</span>`;
      chip.onclick = () => {
        tariffChips.querySelectorAll('.chip').forEach((c) => c.classList.remove('selected'));
        chip.classList.add('selected');
        answers.tariff = t.key;
        updateTotals(); validateForm();
      };
      tariffChips.appendChild(chip);
    });
    tariffWrap.appendChild(tariffChips);
    const tariffHint = document.createElement('div');
    tariffHint.className = 'q-hint';
    tariffHint.innerHTML = PET_TARIFFS.map((t) => `<b style="color:var(--accent)">${t.label} ($${t.price}):</b> ${t.desc}`).join('<br>');
    tariffWrap.appendChild(tariffHint);
    form.appendChild(tariffWrap);
    totalBar.classList.add('show');
  }
}

function updateTotals() {
  if (isKids) {
    const t = KIDS_TARIFFS.find((x) => x.key === answers.tariff);
    let total = t ? t.price : 0;
    (answers.addons || []).forEach((k) => {
      const a = KIDS_ADDONS.find((x) => x.key === k);
      if (a) total += a.price;
    });
    totalVal.textContent = '$' + total;
    return;
  }
  if (track === 'pets') {
    const t = PET_TARIFFS.find((x) => x.key === answers.tariff);
    totalVal.textContent = '$' + (t ? t.price : 0);
    return;
  }
}

function requiredKeys() {
  if (isKids) {
    const keys = ['name', 'gender', 'tariff'];
    if (!presetGenre) keys.push('interest');
    return keys;
  }
  // усі текстові поля обов'язкові; для полів-кнопок теж (крім явно
  // необов'язкових — тут таких немає, кожне питання варте відповіді)
  const keys = allQuestions.map((q) => q.key);
  if (track === 'pets') keys.push('tariff');
  return keys;
}

function validateForm() {
  const missing = requiredKeys().filter((k) => {
    const v = answers[k];
    return v === undefined || v === null || v === '';
  });
  submitBtn.disabled = missing.length > 0;
  return missing;
}

submitBtn.addEventListener('click', () => {
  const missing = validateForm();
  if (missing.length) {
    missing.forEach((k) => {
      const wrap = form.querySelector(`[data-key="${k}"]`);
      const errEl = wrap && wrap.querySelector('.err');
      if (errEl) errEl.classList.add('show');
    });
    const firstBad = form.querySelector(`[data-key="${missing[0]}"]`);
    if (firstBad) firstBad.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const payload = { track, answers, presetGenre: presetGenre || null };
  if (tg) {
    tg.sendData(JSON.stringify(payload));
    tg.close();
  } else {
    // локальний перегляд поза Telegram — просто показуємо, що зібралось
    alert('Поза Telegram WebApp — дані для перевірки:\n\n' + JSON.stringify(payload, null, 2));
  }
});

validateForm();
});
</script>
</body>
</html>
