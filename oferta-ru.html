  h2_1:'1. Предмет послуги', p_1:'Студія створює короткі анімаційні відео (мультфільми) на замовлення — для дітей (з рисами обличчя дитини Клієнта, без фотореалістичної копії) та для дорослих подій (романтика, день народження, весілля, корпоративні історії, сценарій на замовлення).',

  h2_7:'7. Музичний супровід', p_7:'Студія використовує виключно оригінальну або ліцензійно вільну музику. Клієнт може вказати бажаний настрій/жанр музики, але не конкретний захищений авторським правом трек.',

  h2_10:'10. Географія послуги та перша хвиля запуску', p_10:'Послуга надається дистанційно. Під час першої хвилі запуску Студія приймає та обслуговує замовлення від клієнтів з України, Німеччини, Польщі, Чехії, Іспанії та Італії. Оплата здійснюється через Monobank Acquiring (plata by mono); окрема транзакція може бути відхилена банком-емітентом, платіжною системою або обов\'язковими перевірками безпеки. Замовлення з фотографіями дітей оформлює повнолітня особа, яка підтверджує, що є батьком, матір\'ю, законним опікуном або належно уповноваженою особою.',

en: {

  h2_6:'6. Droits sur les matériaux', ul_6:['Le Client garantit avoir le droit d\'utiliser les matériaux fournis (photos, souhaits d\'histoire) et ne pas enfreindre les droits de tiers.','Après paiement intégral et finalisation de la commande, la vidéo finie devient l\'entière propriété du Client.','Les photos fournies par le Client pour réaliser le dessin animé sont supprimées après la finalisation de la commande.'],

  h2_8:'8. Restrictions de contenu', p_8:'Le Studio ne reproduit pas dans les dessins animés des personnages, logos ou marques tiers protégés par le droit d\'auteur.',
  h2_9:'9. Début de l\'exécution et remboursements', p_9:'La commande Cartobi est un contenu numérique personnalisé fourni sans support matériel. Avant le paiement, le Client, par une case distincte et obligatoire, consent expressément au début immédiat de l\'exécution avant l\'expiration du délai de rétractation et reconnaît perdre son droit de rétractation dès le début de l\'exécution (art. 16, point m), directive 2011/83/UE). Le Studio commence le travail immédiatement après le paiement, aucun remboursement n\'est donc effectué. Le Studio conserve la preuve du consentement du Client, la version de l\'Offre publique et la confirmation de paiement et de livraison.',
  h2_10:'10. Zone de service et première phase de lancement', p_10:'Le service est fourni à distance. Lors de la première phase de lancement, le Studio accepte et traite les commandes des clients d\'Ukraine, d\'Allemagne, de Pologne, de Tchéquie, d\'Espagne et d\'Italie. Le paiement est traité via Monobank Acquiring (plata by mono) ; une transaction peut être refusée par la banque émettrice, le réseau de carte ou des contrôles de sécurité obligatoires. Les commandes avec des photos d\'enfants sont passées par un adulte qui confirme être le parent, le représentant légal ou une personne dûment autorisée.',
  h2_11:'11. Contact', p_11:'Prestataire : Cartobi Animation Studio (entrepreneur individuel, Odesa, Ukraine). E-mail : cartobi.com@gmail.com. Pour toute question — via le bot @CartobiBot ou les réseaux sociaux de Cartobi Animation Studio.',

function setOfertaLang(lang) {
  const t = OFERTA[lang] || OFERTA.ua;
  document.getElementById('t-h1').textContent = t.h1;
  document.getElementById('t-updated').textContent = t.updated;
  document.getElementById('t-intro').textContent = t.intro;
  for (let i=1;i<=11;i++) {
    const h2el = document.getElementById('t-h2-'+i);
    if (h2el) h2el.textContent = t['h2_'+i];
    const pEl = document.getElementById('t-p-'+i);
    if (pEl) pEl.textContent = t['p_'+i] || '';
    const ulEl = document.getElementById('t-ul-'+i);
    if (ulEl && t['ul_'+i]) ulEl.innerHTML = t['ul_'+i].map(x => '<li>'+x+'</li>').join('');
  }
  document.documentElement.lang = lang === 'ua' ? 'uk' : lang;
}
setOfertaLang('ru');
