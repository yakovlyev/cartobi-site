function setOfertaLang(lang) {
  const t = OFERTA[lang] || OFERTA.ua;
  document.getElementById('t-h1').textContent = t.h1;
  document.getElementById('t-updated').textContent = t.updated;
  document.getElementById('t-intro').textContent = t.intro;
  for (let i=1;i<=11;i++) {
    const h2el = document.getElementById('t-h2-'+i);
    if (h2el) h2el.textContent = t['h2_'+i];
    const pEl = document.getElementById('t-p-'+i);
    if (pEl) pEl.textContent = t['p_'+i] || '';
    const ulEl = document.getElementById('t-ul-'+i);
    if (ulEl && t['ul_'+i]) ulEl.innerHTML = t['ul_'+i].map(x => '<li>'+x+'</li>').join('');
  }
  document.documentElement.lang = lang === 'ua' ? 'uk' : lang;
}
